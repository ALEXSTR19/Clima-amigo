<div class="registro-container">

  <div class="registro-card">

    <h2>Registrar inventario</h2>

    <form
      (submit)="registrar()"
    >

      <div class="form-group">

        <label>Nombre</label>

        <input
          type="text"
          name="nombre"
          [value]="inventario.nombre"
          (input)="inventario.nombre = $any($event.target).value"
          required
          class="form-control"
        >

      </div>


      <div class="form-group">

        <label>Código</label>

        <input
          type="text"
          name="codigo"
          [value]="inventario.codigo"
          (input)="inventario.codigo = $any($event.target).value"
          required
          class="form-control"
        >

      </div>


      <div class="form-group">

        <label>Marca</label>

        <input
          type="text"
          name="marca"
          [value]="inventario.marca"
          (input)="inventario.marca = $any($event.target).value"
          required
          class="form-control"
        >

      </div>


      <div class="form-group">

        <label>Modelo</label>

        <input
          type="text"
          name="modelo"
          [value]="inventario.modelo"
          (input)="inventario.modelo = $any($event.target).value"
          required
          class="form-control"
        >

      </div>


      <div class="form-group">

        <label>Cantidad</label>

        <input
          type="number"
          name="cantidad"
          [value]="inventario.cantidad"
          (input)="inventario.cantidad = +$any($event.target).value"
          min="0"
          required
          class="form-control"
        >

      </div>


      <button
        type="submit"
        class="btn btn-primary"
      >
        Registrar
      </button>

    </form>


    @if (mensaje) {

      <div class="alert alert-success">
        {{ mensaje }}
      </div>

    }


    @if (error) {

      <div class="alert alert-danger">
        {{ error }}
      </div>

    }

  </div>

</div>
