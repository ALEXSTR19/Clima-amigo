<header class="header">
  <a class="brand" href="#inicio" aria-label="Clima Amigo, ir al inicio">
    <img class="brand__logo" src="logo.jpg" alt="" />
    <span class="brand__name">Clima Amigo</span>
  </a>

  <button 
    class="header__hamburger" 
    (click)="toggleMenu()" 
    aria-label="Abrir menú de navegación"
    [class.header__hamburger--open]="isMenuOpen">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="header__nav" [class.header__nav--active]="isMenuOpen" aria-label="Navegación principal">
    <a class="header__link header__link--cta" routerLink="/inicio" (click)="closeMenu()">Inicio</a>
    <a class="header__link header__link--cta" href="#soluciones" (click)="closeMenu()">Soluciones</a>
    <a class="header__link header__link--cta" href="#galeria" (click)="closeMenu()">Galería</a>
    <a class="header__link header__link--cta" routerLink="/mantenimientos" (click)="closeMenu()">Mantenimientos</a>
    <a class="header__link header__link--cta" href="#contacto" (click)="closeMenu()">Contáctanos</a>
    <a class="header__link login-icon" routerLink="/login" (click)="closeMenu()">
      <img class="login-icon__svg" src="user.svg" alt="" aria-hidden="true" />
      <span>Iniciar sesión</span>
    </a>
  </nav>
</header>
